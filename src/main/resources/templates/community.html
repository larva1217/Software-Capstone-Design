<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>커뮤니티 · Markets</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app">


    <header class="top-bar">
        <div class="top-bar__brand">
            <a th:href="@{/}">
                <span class="logo">◇</span>
                <span class="brand-name">Markets</span>
            </a>
        </div>

        <nav class="main-nav">
            <a th:href="@{/}" class="nav-tab">시장 지표</a>
            <a th:href="@{/chart}" class="nav-tab">주식 차트</a>
            <a th:href="@{/news}" class="nav-tab">뉴스 피드</a>
            <a th:href="@{/community}" class="nav-tab is-active">커뮤니티</a>
        </nav>

        <div class="top-bar__actions">
            <button type="button" class="icon-btn" id="btn-alarm" aria-label="알림">🔔</button>
            <a th:href="@{/login}" class="icon-btn" aria-label="로그인">👤</a>
            <button type="button" class="icon-btn" id="btn-theme" aria-label="테마 전환">🌙</button>
        </div>
    </header>


    <main class="content">

        <section class="view" id="view-community">

            <div class="page-head">
                <h1>커뮤니티</h1>
            </div>


            <div style="padding: 20px; border-bottom: 1px solid #2a2e39;">

                <form action="/community/write" method="post">

                    <input
                            type="text"
                            name="title"
                            placeholder="제목을 입력하세요"
                            class="input"
                            style="margin-bottom: 15px;"
                            required
                    >

                    <textarea
                            name="content"
                            rows="5"
                            placeholder="내용을 입력하세요"
                            class="input"
                            style="margin-bottom: 15px;"
                            required
                    ></textarea>

                    <button
                            type="submit"
                            class="btn btn-primary"
                    >
                        글쓰기
                    </button>

                </form>
            </div>

            <div class="community-list">

                <article
                        class="community-item"
                        th:each="post : ${posts}"
                        style="border-bottom: 1px solid #2a2e39; padding: 20px;"
                >

                    <h3
                            th:text="${post.title}"
                            style="color: #d1d4dc;"
                    >
                        게시글 제목
                    </h3>

                    <p
                            th:text="${post.content}"
                            style="color: #848e9c;"
                    >
                        게시글 내용
                    </p>

                    <form
                            th:action="@{/community/delete/{id}(id=${post.id})}"
                            method="post"
                            style="margin-top: 10px;"
                    >
                        <button
                                type="submit"
                                class="btn"
                                style="background: #ff4d4f; color: white;"
                        >
                            삭제
                        </button>
                    </form>

                </article>
            </div>
        </section>
    </main>

    <footer class="footer">
        <span>모든 투자에 대한 책임은 투자자 본인에게 있습니다.</span>
    </footer>

</div>

<script th:src="@{/common.js}"></script>

</body>
</html>
