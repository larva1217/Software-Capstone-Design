<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>커뮤니티 · Markets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <div class="top-bar__brand">
        <a href="../../../../../index.html" th:href="@{/}">
          <span class="logo" aria-hidden="true">◇</span>
          <span class="brand-name">Markets</span>
        </a>
      </div>

      <nav class="main-nav" aria-label="주 메뉴">
          <a th:href="@{/}" class="nav-tab" aria-current="page">시장 지표</a>
          <a th:href="@{/chart}" class="nav-tab">주식 차트</a>
          <a th:href="@{/news}" class="nav-tab">뉴스 피드</a>
          <a th:href="@{/community}" class="nav-tab is-active">커뮤니티</a>
      </nav>

        <div class="top-bar__actions">
            <button class="icon-btn">🔔</button>
            <button class="icon-btn">👤</button>
            <button class="icon-btn" id="btn-theme">🌙</button>
        </div>
    </header>

    <main class="content">
      <div id="view-community"></div>
    </main>

    <footer class="footer">
      <span>데모 UI · 데이터는 샘플입니다</span>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="common.js"></script>
  <script src="app-community.js"></script>

</body>
</html>
