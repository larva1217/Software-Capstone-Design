<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>시장 지표 · Markets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
    <header class="top-bar">
        <div class="top-bar__brand">
            <a href="index.html" th:href="@{/}">
                <span class="logo" aria-hidden="true">◇</span>
                <span class="brand-name">Markets</span>
            </a>
        </div>
        <nav class="main-nav" aria-label="주 메뉴">
            <a th:href="@{/}" class="nav-tab is-active" aria-current="page">시장 지표</a>
            <a th:href="@{/chart}" class="nav-tab">주식 차트</a>
            <a th:href="@{/news}" class="nav-tab">뉴스 피드</a>
            <a th:href="@{/community}" class="nav-tab">커뮤니티</a>
        </nav>

        <div th:replace="~{fragments/header-actions :: header-actions}"></div>
    </header>

    <main class="content">
        <section class="view" id="view-markets">
            <div class="page-head">
                <h1>시장 지표</h1>
                <p class="muted">국내외 주요 지수를 한눈에 확인합니다.</p>
            </div>

            <!-- 지표 그리드 -->
            <div class="indices-grid" id="indices-grid">
                <div class="index-card" th:each="index : ${indices}">
                    <div class="index-card__label" th:text="${index.label}">국내 · 한국</div>
                    <div class="index-card__name" th:text="${index.name}">KOSPI</div>
                    <div class="index-card__value" th:text="${index.value}">5,000</div>
                    <div th:class="|index-card__change ${index.isUp ? 'is-up' : 'is-down'}|"
                         th:text="${index.change}">+0.50%</div>
                </div>
            </div>

            <!-- ✨ 신규 추가: AI 브리핑 섹션 -->
            <div class="section-block ai-briefing-section" style="margin-top: 2rem; margin-bottom: 2rem; padding: 1.5rem; border: 1px solid #333; border-radius: 8px; background-color: #1a1a1a;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h2 style="margin: 0; font-size: 1.2rem;">🤖 AI 시장 종합 브리핑</h2>
                    <button id="btn-ai-analyze" class="btn btn-primary">시장 분석하기</button>
                </div>
                <div id="ai-briefing-result" style="line-height: 1.6; color: #ccc;">
                    버튼을 눌러 현재 시장 지표에 대한 AI의 실시간 분석을 받아보세요.
                </div>
            </div>

        </section>
    </main>

    <footer class="footer">
        <span>모든 투자에 대한 책임은 투자자 본인에게 있습니다.</span>
    </footer>
</div>

<script src="common.js"></script>
<script src="app-markets.js"></script>

<script>
    window.addEventListener('load', function () {
        const btnUser = document.getElementById('btn-user');
        const userMenuPopup = document.getElementById('user-menu-popup');

        if (btnUser && userMenuPopup) {
            // 1. 아이콘 클릭 시 팝업 열기/닫기 (토글)
            btnUser.addEventListener('click', function (e) {
                e.stopPropagation(); // document 클릭 이벤트로 번지는 것 차단

                const isHidden = userMenuPopup.hasAttribute('hidden');
                if (isHidden) {
                    userMenuPopup.removeAttribute('hidden');
                    btnUser.setAttribute('aria-expanded', 'true');
                } else {
                    userMenuPopup.setAttribute('hidden', '');
                    btnUser.setAttribute('aria-expanded', 'false');
                }
            });

            // 2. 팝업창 바깥의 다른 영역을 클릭하면 자동으로 팝업 닫기
            document.addEventListener('click', function (e) {
                if (!userMenuPopup.contains(e.target) && e.target !== btnUser) {
                    userMenuPopup.setAttribute('hidden', '');
                    btnUser.setAttribute('aria-expanded', 'false');
                }
            });
        }
    });
</script>

</body>
</html>
