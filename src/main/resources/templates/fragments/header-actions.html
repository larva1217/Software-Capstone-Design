<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="header-actions" class="top-bar__actions">

    <!-- 1. 로그인 변수가 있을 때 (로그인 완료 상태) -->
    <div class="user-menu" th:if="${loginUsername != null}">
        <button type="button"
                class="icon-btn"
                id="btn-user"
                aria-label="계정 메뉴 열기"
                aria-haspopup="true"
                aria-expanded="false">👤</button>

        <!-- 팝업 메뉴: absolute 배치를 위해 부모(.user-menu)의 하위에 위치 -->
        <div class="user-menu__popup" id="user-menu-popup" hidden>
            <p class="user-menu__label">로그인됨</p>
            <p class="user-menu__name" th:text="${loginUsername}">user</p>
            <form th:action="@{/logout}" method="post" class="user-menu__form">
                <button type="submit" class="btn user-menu__logout">로그아웃</button>
            </form>
        </div>
    </div>

    <!-- 2. 로그인 변수가 없을 때 (로그아웃 상태) -->
    <!-- [수정] 로그인 후의 .user-menu와 동일한 크기/정렬을 갖도록 div.user-menu로 감싸 대칭을 맞춥니다. -->
    <div class="user-menu" th:unless="${loginUsername != null}">
        <a th:href="@{/login}"
           class="icon-btn"
           id="btn-login"
           aria-label="로그인 페이지로 이동">👤</a>
    </div>

    <!-- 3. 공통 테마 전환 버튼 -->
    <button type="button" class="icon-btn" id="btn-theme" aria-label="테마 전환">🌙</button>

</div>
</body>
</html>
