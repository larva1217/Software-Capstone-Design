<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>주식 차트 Markets</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <link rel="stylesheet" th:href="@{/styles.css}" />

    <!-- TradingView 라이브러리 -->
    <script src="https://s3.tradingview.com/tv.js"></script>

    <style>
        /* 레이아웃: 차트와 주문 패널 나란히 배치 */
        .chart-layout {
            display: flex;
            gap: 20px;
            margin-top: 24px;
            align-items: flex-start;
        }

        .chart-container-wrapper {
            flex: 3; /* 차트 비중 확대 */
            min-width: 0;
        }

        #global-chart-container {
            width: 100% !important;
            height: 650px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #131722;
            border: 1px solid #2a2e39;
        }

        /* 주문 패널 스타일 */
        .order-panel {
            flex: 1;
            background: #1e222d;
            border: 1px solid #2a2e39;
            border-radius: 12px;
            padding: 24px;
            color: #d1d4dc;
            position: sticky;
            top: 20px;
        }

        .order-panel h2 { font-size: 18px; margin-bottom: 20px; color: #fff; }

        /* 🔥 추가된 검색창 스타일 */
        .search-group {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .search-group input {
            flex: 1;
            padding: 12px;
            background: #131722;
            border: 1px solid #3b4352;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .search-group button {
            padding: 10px 16px;
            background: #2962FF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .search-group button:hover {
            background: #1E53E5;
        }

        .order-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1; padding: 10px; border: none; border-radius: 4px;
            cursor: pointer; background: #2a2e39; color: #848e9c; font-weight: 600;
        }
        .tab-btn.active.buy { background: #2ebd85; color: white; }
        .tab-btn.active.sell { background: #f6465d; color: white; }

        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 12px; margin-bottom: 6px; color: #848e9c; }
        .input-group input {
            width: 100%; padding: 12px; background: #131722; border: 1px solid #3b4352;
            color: white; border-radius: 4px; box-sizing: border-box;
        }

        .order-summary {
            margin: 20px 0; padding-top: 15px; border-top: 1px solid #2a2e39;
            display: flex; justify-content: space-between; font-size: 14px;
        }

        .btn-execute {
            width: 100%; padding: 16px; border: none; border-radius: 4px;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-buy { background: #2ebd85; color: white; }
        .btn-sell { background: #f6465d; color: white; }

        /* 포트폴리오 섹션 */
        .portfolio-section { margin-top: 40px; padding: 24px; background: #1e222d; border-radius: 12px; border: 1px solid #2a2e39; }
        .portfolio-section h2 { font-size: 20px; margin-bottom: 20px; color: #fff; }

        .portfolio-table { width: 100%; border-collapse: collapse; color: #d1d4dc; }
        .portfolio-table th { text-align: left; padding: 12px; border-bottom: 2px solid #2a2e39; color: #848e9c; font-size: 13px; }
        .portfolio-table td { padding: 16px 12px; border-bottom: 1px solid #2a2e39; }
        .text-up { color: #2ebd85; }
        .text-down { color: #f6465d; }

        .content { width: 100% !important; max-width: 1600px; margin: 0 auto; padding: 20px; box-sizing: border-box; }

        /* AI 분석 패널 스타일 */
        .ai-panel {
            background: #1e222d;
            border: 1px solid #2a2e39;
            border-radius: 12px;
            padding: 24px;
            margin-top: 20px;
        }
        .ai-panel h3 {
            color: #fff;
            font-size: 16px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ai-content {
            font-size: 14px;
            line-height: 1.6;
            color: #d1d4dc;
            background: #131722;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #3b4352;
        }
        .ai-loading {
            text-align: center;
            color: #2ebd85;
            font-weight: bold;
            padding: 20px 0;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>

<body>
<div class="app">
    <header class="top-bar">
        <div class="top-bar__brand">
            <a th:href="@{/}">
                <span class="logo">◇</span>
                <span class="brand-name">Markets</span>
            </a>
        </div>
        <nav class="main-nav">
            <a th:href="@{/}" class="nav-tab">시장 지표</a>
            <a th:href="@{/chart}" class="nav-tab is-active">주식 차트</a>
            <a th:href="@{/news}" class="nav-tab">뉴스 피드</a>
            <a th:href="@{/community}" class="nav-tab">커뮤니티</a>
        </nav>
        <div class="top-bar__actions">
            <button class="icon-btn">🔔</button>
            <button class="icon-btn">👤</button>
            <button class="icon-btn" id="btn-theme">🌙</button>
        </div>
    </header>

    <main class="content">
        <div class="page-head">
            <h1>주식 차트</h1>
            <p class="muted">모든 투자에 대한 책임은 투자자 본인에게 있습니다.</p>
        </div>

        <div class="chart-layout">
            <div class="chart-container-wrapper">
                <!-- 트레이딩뷰 차트 영역 -->
                <div id="global-chart-container"></div>

                <!-- AI 분석 패널 영역 -->
                <div class="ai-panel">
                    <h3>✨ AI 종목 요약 및 뉴스 분석</h3>
                    <div id="ai-content" class="ai-content">
                        종목을 검색하면 AI가 실시간 분석을 시작합니다.
                    </div>
                </div>
            </div>

            <aside class="order-panel">
                <div class="user-balance" style="margin-bottom: 20px; padding: 15px; background: #131722; border-radius: 8px; border: 1px solid #2a2e39;">
                    <div style="font-size: 12px; color: #848e9c; margin-bottom: 6px;">사용 가능 잔액</div>
                    <strong style="color: #fff; font-size: 18px;"
                            th:text="${#numbers.formatInteger(user.balance, 3, 'COMMA')} + ' KRW'">
                        10,000,000 KRW
                    </strong>
                </div>

                <!-- 🔥 중앙 제어 1: 종목 검색창 -->
                <div class="search-group">
                    <input id="symbolSearch" placeholder="종목 검색 (예: TSLA, AAPL)" />
                    <button onclick="searchSymbol()">검색</button>
                </div>

                <h2>주문하기</h2>
                <div class="order-tabs">
                    <button class="tab-btn active buy" id="tab-buy">매수</button>
                    <button class="tab-btn" id="tab-sell">매도</button>
                </div>
                <div class="input-group">
                    <label>가격 (USD)</label>
                    <input type="number" id="order-price" value="0" readonly />
                </div>
                <div class="input-group">
                    <label>수량 (주)</label>
                    <input type="number" id="order-qty" value="1" min="1" />
                </div>
                <div class="order-summary">
                    <span>총 주문금액</span>
                    <strong id="order-total">0.00 USD</strong>
                </div>
                <button class="btn-execute btn-buy" id="btn-order-exec">매수하기</button>
            </aside>
        </div>

        <section class="portfolio-section">
            <h2>내 보유 종목</h2>
            <table class="portfolio-table">
                <thead>
                <tr>
                    <th>종목</th>
                    <th>보유수량</th>
                    <th>평균단가</th>
                    <th>현재가</th>
                    <th>수익률</th>
                    <th>평가금액</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${portfolios}">
                    <td><strong th:text="${p.tickerSymbol}">NVDA</strong></td>
                    <td><span th:text="${p.quantity}">0</span> 주</td>
                    <td>$ <span th:text="${#numbers.formatDecimal(p.averagePrice, 1, 'COMMA', 2, 'POINT')}">0</span></td>
                    <td>$ <span class="current-price" th:text="${#numbers.formatDecimal(p.averagePrice, 1, 'COMMA', 2, 'POINT')}">0</span></td>
                    <td class="text-up">+0.00%</td>
                    <td>$ <span th:text="${#numbers.formatDecimal(p.quantity * p.averagePrice, 1, 'COMMA', 2, 'POINT')}">0</span></td>
                </tr>

                <tr th:if="${#lists.isEmpty(portfolios)}">
                    <td colspan="6" style="text-align: center; padding: 40px; color: #848e9c;">보유 중인 종목이 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </section>
    </main>
</div>

<script th:src="@{/common.js}"></script>
<script th:src="@{/app-news.js}"></script>

<script>
    // 🧠 1. 상태 변수
    let tvWidget = null;
    let currentSymbol = "NASDAQ:NVDA";

    // 🔍 2. 검색 기능 추가
    function searchSymbol() {
        const input = document.getElementById("symbolSearch").value.trim().toUpperCase();
        if (!input) return;

        // 거래소 코드가 없으면 기본으로 NASDAQ 붙이기
        const symbol = input.includes(":") ? input : "NASDAQ:" + input;
        changeSymbol(symbol);
    }

    // ⌨️ Enter 검색 지원
    document.addEventListener("DOMContentLoaded", function () {
        const searchInput = document.getElementById("symbolSearch");
        if (searchInput) {
            searchInput.addEventListener("keypress", function (e) {
                if (e.key === "Enter") {
                    searchSymbol();
                }
            });
        }
    });

    // 🔁 3. 종목 변경 핵심 로직 (중앙 통제)
    function changeSymbol(newSymbol) {
        console.log("종목 변경:", newSymbol);
        currentSymbol = newSymbol;

        // 탭 버튼 UI 업데이트 (검색한 종목이 탭에 있으면 활성화)
        const cleanNewTicker = newSymbol.includes(":") ? newSymbol.split(":")[1] : newSymbol;
        document.querySelectorAll('.symbol-selector .tab-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.innerText === cleanNewTicker) {
                btn.classList.add('active');
            }
        });

        // 차트 및 데이터 새로고침
        renderChart(currentSymbol);
    }

    // 📊 4. 차트 렌더링 (정리 버전)
    function renderChart(symbol) {
        const container = document.getElementById("global-chart-container");

        // 기존 widget 깔끔하게 제거
        if (tvWidget) {
            try {
                tvWidget.remove?.();
            } catch (e) {
                console.log("widget 제거 실패 (무시 가능)");
            }
            tvWidget = null;
        }

        container.innerHTML = "";

        // 새 차트 생성
        tvWidget = new TradingView.widget({
            autosize: true,
            symbol: symbol,
            interval: "D",
            timezone: "Asia/Seoul",
            theme: "dark",
            container_id: "global-chart-container",
            locale: "ko",
            allow_symbol_change: false // 🔥 검색창을 통해서만 바꾸도록 차트 내 검색 차단
        });

        // 🔥 핵심: 차트 렌더링 시 무조건 가격과 AI를 동기화
        updatePriceAndUI(symbol);
        fetchAIAnalysis(symbol);
    }

    // 🤖 5. AI 연동
    function fetchAIAnalysis(fullSymbol) {
        const cleanTicker = fullSymbol.includes(":") ? fullSymbol.split(":")[1] : fullSymbol;
        const aiContent = document.getElementById("ai-content");

        aiContent.innerHTML = `<div class="ai-loading">🤖 AI 분석 중... (${cleanTicker}) ⏳</div>`;

        fetch(`/api/ai/analyze?ticker=${cleanTicker}`)
            .then(res => res.json())
            .then(data => {
                if (data && data.analysisResult) {
                    aiContent.innerHTML = data.analysisResult;
                } else {
                    aiContent.innerHTML = "<div style='color: #f6465d;'>AI 분석 결과를 가져오지 못했습니다.</div>";
                }
            })
            .catch(err => {
                console.error("AI 연동 에러:", err);
                aiContent.innerHTML = "<div style='color: #f6465d;'>AI 분석 서버와 연결할 수 없습니다.</div>";
            });
    }

    // 💵 총액 계산 함수
    function updateTotal() {
        const priceInput = document.getElementById('order-price');
        const qtyInput = document.getElementById('order-qty');
        const totalText = document.getElementById('order-total');

        if (priceInput && qtyInput && totalText) {
            const price = parseFloat(priceInput.value) || 0;
            const qty = parseInt(qtyInput.value) || 0;
            const total = (price * qty).toFixed(2);
            totalText.innerText = total + " USD";
        }
    }

    // 📈 가격 업데이트 함수
    function updatePriceAndUI(fullSymbol) {
        const titleP = document.querySelector('.page-head p');
        if (titleP) titleP.innerText = fullSymbol;

        const cleanTicker = fullSymbol.includes(':') ? fullSymbol.split(':')[1] : fullSymbol;

        fetch(`/api/stock/price?symbol=${cleanTicker}`)
            .then(res => res.json())
            .then(data => {
                const priceInput = document.getElementById('order-price');
                if (priceInput && data.currentPrice) {
                    const price = parseFloat(data.currentPrice).toFixed(2);
                    priceInput.value = price;
                    priceInput.defaultValue = price;
                    updateTotal();
                }
            })
            .catch(err => {
                console.warn("시세 연동 중 (백엔드 미연결):", err);
                updateTotal();
            });
    }

    // 🚀 페이지 로드 및 이벤트 리스너 세팅
    window.addEventListener('load', function() {
        // 최초 시작 렌더링
        renderChart(currentSymbol);

        const qtyInput = document.getElementById('order-qty');
        const buyTab = document.getElementById('tab-buy');
        const sellTab = document.getElementById('tab-sell');
        const execBtn = document.getElementById('btn-order-exec');
        const tickerP = document.querySelector('.page-head p');

        // 수량 변경 시 총액 업데이트
        if (qtyInput) {
            qtyInput.addEventListener('input', updateTotal);
        }

        // 매수/매도 탭 전환
        if(buyTab && sellTab && execBtn) {
            buyTab.onclick = () => {
                buyTab.classList.add('active', 'buy');
                sellTab.classList.remove('active', 'sell');
                execBtn.innerText = "매수하기";
                execBtn.className = "btn-execute btn-buy";
            };
            sellTab.onclick = () => {
                sellTab.classList.add('active', 'sell');
                buyTab.classList.remove('active', 'buy');
                execBtn.innerText = "매도하기";
                execBtn.className = "btn-execute btn-sell";
            };
        }

        // 주문 실행 버튼
        if (execBtn) {
            execBtn.onclick = () => {
                // 중앙 통제 변수 사용
                const fullSymbol = currentSymbol;
                const ticker = fullSymbol.includes(':') ? fullSymbol.split(':')[1] : fullSymbol;
                const quantity = document.getElementById('order-qty').value;
                const price = Math.floor(document.getElementById('order-price').value);

                const isBuy = execBtn.innerText === "매수하기";
                const endpoint = isBuy ? "/api/trade/buy" : "/api/trade/sell";

                fetch(`${endpoint}?ticker=${ticker}&quantity=${quantity}&price=${price}`, {
                    method: 'POST'
                })
                .then(async response => {
                    const text = await response.text();
                    if (response.ok) {
                        alert(text);
                        location.reload();
                    } else {
                        alert("거래 실패: " + text);
                    }
                })
                .catch(error => alert("네트워크 에러: " + error.message));
            };
        }
    });
</script>
</body>
</html>
